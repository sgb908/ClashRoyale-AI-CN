name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # 关键：p4a 会用具体 CPython 版本（如 3.14.2）去 pip 下载
      # numpy 的 Android wheel。numpy 长期滞后于 CPython 新版本，
      # 所以这里显式钉一个 p4a 认识的、有 Android wheel 的 Python。
      - name: Pin python-for-android 的 python 版本
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path('buildozer.spec')
          s = p.read_text()
          s = re.sub(r'(?m)^android\.python\.version\s*=.*$', 'android.python.version = 3.12', s)
          if 'android.python.version' not in s:
              s = s.replace('requirements = python3,', 'android.python.version = 3.12\nrequirements = python3,')
          p.write_text(s)
          print(s)
          PY

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Check result
        run: |
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "APK OK"
            ls -lh bin/
          else
            echo "BUILD FAILED"
            tail -200 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cr-ai-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7